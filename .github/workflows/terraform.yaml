name: Terraform

on:
  workflow_dispatch:

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/897940867321/locations/global/workloadIdentityPools/github/providers/athirakb01-github-terraform-demo'
          service_account: 'github-terraform@project-32294c92-6824-409d-940.iam.gserviceaccount.com'
      - name: terraform init
        run: terraform init
      - name: terraform plan
        run: terraform plan -out=tfplan 

  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment:
      name: production
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/897940867321/locations/global/workloadIdentityPools/github/providers/athirakb01-github-terraform-demo'
          service_account: 'github-terraform@project-32294c92-6824-409d-940.iam.gserviceaccount.com'
      - name: terraform init
        run: terraform init
      - name: terraform apply
        run: terraform apply tfplan
